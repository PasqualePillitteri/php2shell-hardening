# php2shell: memory cap for PHP-FPM, to pair with php_admin_value[memory_limit] = -1.
# Install it as a drop-in for the FPM unit, for example
#   /etc/systemd/system/php7.4-fpm.service.d/php2shell-memory.conf  (Debian, Ubuntu)
#   /etc/systemd/system/php-fpm.service.d/php2shell-memory.conf     (RHEL, CentOS)
# Size MemoryMax= above what the pool really uses, and check that first: a cap below the
# current usage makes the kernel reclaim and kill right away.
#   systemctl show -p MemoryCurrent php7.4-fpm
# On cgroup v1 MemoryCurrent can be [not set]; sum the RSS of the FPM processes instead.
#   stat -fc %T /sys/fs/cgroup     # cgroup2fs means cgroup v2, tmpfs means v1 or hybrid
#
# Apply the cap now, without restarting, then load the drop-in for the next boot:
#   systemctl set-property --runtime php7.4-fpm.service MemoryMax=2G MemorySwapMax=0
#   systemctl set-property --runtime php7.4-fpm.service MemoryLimit=2G   # cgroup v1 only
#   systemctl daemon-reload
#   systemctl show -p MemoryMax -p MemoryLimit -p OOMPolicy php7.4-fpm
# OOMPolicy= cannot be set with set-property; daemon-reload applies it to the running
# service, no restart needed.

[Service]
MemoryMax=2G
# cgroup v2: without it the pool goes to swap when it reaches MemoryMax= and a runaway
# worker is not killed until swap runs out.
MemorySwapMax=0
# The cgroup v1 name of the cap. On cgroup v2 remove it: MemoryMax= is enough and
# systemd 252 and later log that MemoryLimit= is deprecated.
MemoryLimit=2G

# The default OOMPolicy=stop stops the whole service, master and every pool, the first time
# the kernel kills a worker for memory on cgroup v2. With continue the master respawns the
# worker. On cgroup v1 systemd does not see OOM kills at all, and systemd older than 243
# (Debian 10, CentOS 8) ignores this line.
OOMPolicy=continue

# The kernel kills one process, normally the largest worker, but the master is not excluded.
# If the master goes, bring the service back.
Restart=on-failure

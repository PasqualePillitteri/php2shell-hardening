# php2shell (CVE-2026-109618 / CVE-2026-109619) - UNOFFICIAL, PROVISIONAL.
# LiteSpeed Enterprise and OpenLiteSpeed. Real fix: update PHP.
#
# Where this goes:
#   LiteSpeed Enterprise  -> .htaccess (the rewrite engine reads Apache syntax), or
#                            WebAdmin -> Virtual Hosts -> Rewrite -> Rewrite Rules.
#   OpenLiteSpeed         -> WebAdmin -> Virtual Hosts -> Rewrite -> Rewrite Rules, with
#                            "Enable Rewrite" set to Yes. Restart the server afterwards,
#                            a graceful restart is not always enough for rewrite changes.
#
# OpenLiteSpeed stops at [L] for good, unlike Apache, which stops only the current pass.
# Put these lines first, above the application's own rules (WordPress, Laravel and the rest),
# or an earlier [L] swallows them.
RewriteEngine On
RewriteCond %{REQUEST_METHOD} ^(POST|PUT|PATCH)$ [NC]
RewriteCond %{HTTP:Content-Type} ^[[:space:]]*multipart/form-data([;,[:space:]]|$) [NC]
RewriteRule ^ - [F,L]

# Verify with test/verify.sh against staging: the LiteSpeed rewrite engine follows the
# mod_rewrite specification but is a separate implementation, so confirm that multipart is
# really blocked instead of assuming it from the Apache rule.

# Session upload progress goes in the php.ini of each lsphp build, not in this file. Every
# version has its own, for example /usr/local/lsws/lsphp84/etc/php.ini (Debian and Ubuntu:
# /usr/local/lsws/lsphp84/etc/php/8.4/litespeed/php.ini). Use php-fpm/99-php2shell.ini as the
# content, then restart lsws so every lsphp worker is recreated:
#
#   session.upload_progress.enabled = Off
#
# Check the value from the web SAPI with a temporary phpinfo() page, not from the CLI binary:
# lsphp and the CLI read different php.ini files.

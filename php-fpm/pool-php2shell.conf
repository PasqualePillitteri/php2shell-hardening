; php2shell: settings from the PHP advisory of 21 October 2026, for a PHP-FPM pool.
; Paste these lines inside the pool section (for example [www] in www.conf), then reload
; PHP-FPM so every worker is recreated with them. Set process_control_timeout first (see
; global-php2shell.conf), or the reload cuts the requests in flight. php_admin_* values
; cannot be overridden by the application, unlike ini_set() or .user.ini.
; None of this makes an installation safe. Only updating PHP is a complete fix.

; Removes the memory limit an attacker could trip on purpose (CVE-2026-109618). An underlying
; allocation failure can still reach the vulnerable path, so pair it with a container or cgroup
; limit (see systemd/php-fpm-memory.conf). Do not use RLIMIT_AS, RLIMIT_DATA or `ulimit -v`.
php_admin_value[memory_limit] = -1

; 8M for applications without uploads. If uploads are needed, PHP suggests 32M, with
; upload_max_filesize always below post_max_size.
php_admin_value[post_max_size] = 8M
php_admin_value[upload_max_filesize] = 2M

; The advisory asks for a lower nesting depth than the default 64.
php_admin_value[max_input_nesting_level] = 32

; Blocks the confirmed session paths of CVE-2026-109619, not other variants. Keep it off
; after the update too if you do not use the feature.
php_admin_flag[session.upload_progress.enabled] = off

; PHP 8.5 only. Uncomment there: it blocks the confirmed fatal backtrace path.
;php_admin_flag[fatal_error_backtraces] = off

; Workers are never recycled with the default 0, so stale state can live as long as the
; worker. 500 bounds that at almost no cost.
pm.max_requests = 500

; Stronger and costly: recreates the worker after every request, so stale state has no
; next request on the same worker to reach. Use it instead of 500 if performance allows.
;pm.max_requests = 1

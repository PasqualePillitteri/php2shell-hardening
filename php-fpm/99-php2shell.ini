; php2shell - disattiva session upload progress (UNOFFICIAL, PROVISIONAL).
; E' PHP_INI_PERDIR: ini_set() a runtime NON la cambia. Va in php.ini (FPM/Apache),
; in un pool FPM (php_admin_flag[session.upload_progress.enabled] = off) o in .user.ini (CGI/FastCGI).
; Secondo un ricercatore chiude UNO solo dei due bug ipotizzati. Gli upload continuano a funzionare.
; Verifica dal SAPI web con phpinfo() (NON da CLI), poi cancella il file di test. Ricarica FPM.
session.upload_progress.enabled = Off

; In piu', blocca la session fixation passata nel corpo POST (segnalata in un PoC): la
; sessione non puo' essere fissata da un campo della richiesta, solo dal cookie.
session.use_only_cookies = On

; Rifiuta gli ID di sessione sconosciuti forniti dal client (hardening sessione).
session.use_strict_mode = On

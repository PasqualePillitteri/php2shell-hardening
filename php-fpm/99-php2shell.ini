; php2shell: disable session upload progress (unofficial, provisional mitigation).
; It is PHP_INI_PERDIR: ini_set() at runtime does not change it. It goes in php.ini (FPM or
; Apache), in an FPM pool (php_admin_flag[session.upload_progress.enabled] = off) or in
; .user.ini (CGI/FastCGI).
; Per the PHP advisory it closes the confirmed session paths of CVE-2026-109619, not other
; variants. It is also the only mitigation for CVE-2026-115560 (note of 23 October 2026),
; which has no release yet: keep it off after the update too, until the next bugfix release.
; Uploads keep working.
; Check the value from the web SAPI with phpinfo() (not from the CLI), then delete the test
; file. Reload FPM.
session.upload_progress.enabled = Off

; Also blocks the session fixation passed in the POST body (seen in a PoC): the session
; cannot be fixed from a request field, only from the cookie.
session.use_only_cookies = On

; Reject unknown session IDs supplied by the client (session hardening).
session.use_strict_mode = On

; The other settings from the advisory (memory_limit, post_max_size, fatal_error_backtraces)
; belong in the FPM pool as php_admin_value, where the application cannot change them.
; See the "PHP settings" section of the README.

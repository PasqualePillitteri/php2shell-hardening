; php2shell: lets a PHP-FPM reload finish the requests in flight.
; Put it in the [global] section of php-fpm.conf (for example /etc/php/7.4/fpm/php-fpm.conf
; or /etc/php-fpm.conf), above the include= line. A line added at the end of the file is
; read after the pool files and lands in the last pool, which does not accept it.
;
; With the default 0 the master sends SIGQUIT and then SIGTERM to every worker at once, so a
; reload drops the requests in flight with a 502. With 10s each worker has up to 10 seconds
; to finish its request.
;
; The reload that applies this line still runs with the old value, because the master stops
; the workers before it re-reads the configuration. Apply it at a quiet moment, then every
; later reload is graceful:
;   php-fpm7.4 -t && systemctl reload php7.4-fpm
process_control_timeout = 10s

events {}
http {
    map "$request_method:$content_type" $pp_mp {
        default 0;
        "~*^(POST|PUT|PATCH):\s*multipart/form-data([;,\s]|$)" 1;
    }
    map $request_uri $pp_upload_route {
        default 0;
        "~*^/upload(/|\?|$)"                      1;
        "~*^/api/upload(/|\?|$)"                  1;
        "~*^/wp-admin/async-upload\.php(/|\?|$)"  1;
    }
    map $uri $pp_errpage {
        volatile;
        default                     0;
        "~^/error/[0-9]{3}\.html$"  1;
    }
    map "$pp_mp$pp_upload_route$pp_errpage" $pp_block_mp {
        volatile;
        default 0;
        "100"   1;
    }
    server {
        listen 80;
        error_page 403 /error/403.html;
        recursive_error_pages on;
        if ($pp_block_mp) { return 403; }
        location = /error/403.html { internal; return 200 "BLOCKED-403\n"; }
        location /upload { return 200 "REACHED\n"; }
        location / { return 200 "REACHED\n"; }
    }
}

events {}
http {
    map "$request_method:$content_type" $pp_mp {
        default 0;
        "~*^(POST|PUT|PATCH):\s*multipart/form-data([;,\s]|$)" 1;
    }
    map $request_uri $pp_upload_route { default 0; "~*^/upload(/|\?|$)" 1; }
    map "$pp_mp$pp_upload_route" $pp_block_mp { default 0; "10" 1; }
    server {
        listen 80;
        error_page 403 /error/403.html;
        recursive_error_pages on;
        if ($pp_block_mp) { return 403; }
        location = /error/403.html { internal; return 200 "ERR\n"; }
        location / { return 200 "REACHED\n"; }
    }
}

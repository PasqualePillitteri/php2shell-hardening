# php2shell - regola ModSecurity (livello extra, NON sostituisce l'aggiornamento di PHP).
# Blocca le richieste con un campo chiamato PHP_SESSION_UPLOAD_PROGRESS, usato dal PoC
# per raggiungere il callback di session.upload_progress. I WAF interpretano il
# multipart in modo diverso da PHP: e' un livello, non una garanzia.
SecRequestBodyAccess On
SecRule ARGS_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS" \
    "id:1026109618,phase:2,t:none,deny,status:403,log,\
    msg:'php2shell: campo PHP_SESSION_UPLOAD_PROGRESS bloccato (CVE-2026-109618/109619)'"
# Se hai cambiato session.upload_progress.name in php.ini, sostituisci il nome qui sopra.

# php2shell: ModSecurity rules, an extra layer. They do not replace updating PHP.
# A WAF parses multipart differently from PHP, so a request that passes here is not
# necessarily one PHP reads the same way. Test every rule in DetectionOnly mode first.

SecRequestBodyAccess On

# 1. The form field that triggers session upload progress (path of CVE-2026-109619).
# If you changed session.upload_progress.name in php.ini, use that name here.
SecRule ARGS_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS" \
    "id:1026109618,phase:2,t:none,deny,status:403,log,\
    msg:'php2shell: PHP_SESSION_UPLOAD_PROGRESS field blocked (CVE-2026-109618/109619)'"

# 2. Bodies the WAF cannot parse cleanly. A parser disagreement between WAF and PHP is the
# gap an attacker looks for, so rejecting malformed requests is safer than letting them pass.
SecRule REQBODY_ERROR "!@eq 0" \
    "id:1026109619,phase:2,t:none,deny,status:400,log,\
    msg:'php2shell: request body parse error'"
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:1026109620,phase:2,t:none,deny,status:400,log,\
    msg:'php2shell: multipart strict error'"

# 3. Body size limits. These are global directives, set them in the main ModSecurity
# configuration and also at the web server. 8 MB suits an application without uploads.
# SecRequestBodyLimit         8388608
# SecRequestBodyNoFilesLimit  131072
# SecRequestBodyLimitAction   Reject

# 4. Optional: block multipart outside the upload routes, as the web server rules in this
# repository do. Adapt the route list to your application.
# SecRule REQUEST_METHOD "@rx ^(POST|PUT|PATCH)$" \
#     "id:1026109621,phase:1,t:none,deny,status:403,log,chain,\
#     msg:'php2shell: multipart blocked outside upload routes'"
#     SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*multipart/form-data([;,\s]|$)" "chain"
#         SecRule REQUEST_URI "!@rx ^/(api/)?upload(/|\?|$)"

# Include INSIDE the server{} block (before the locations that pass to PHP).
# Requires php2shell-maps.conf loaded in http{}.
if ($pp_block_mp) { return 403; }

# Note: if you do NOT use error_page/recursive_error_pages you may use `return 444;` to drop

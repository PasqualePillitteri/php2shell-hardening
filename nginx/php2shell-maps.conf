# php2shell (CVE-2026-109618 / CVE-2026-109619) - UNOFFICIAL, PROVISIONAL mitigation.
# Include in the http{} context (e.g. /etc/nginx/conf.d/php2shell-maps.conf).
# Blocks POST/PUT/PATCH multipart/form-data except on routes that do real uploads.
# The real fix is updating PHP.

# multipart detector. $content_type is nginx's Content-Type header var (the same value PHP
# sees via fastcgi_params CONTENT_TYPE). PHP lowercases the header and truncates it at the
# first ';', ',' or space, then looks for "boundary" anywhere, so
# "multipart/form-data,boundary=x" is multipart to PHP. The regex covers that grammar.
# PUT/PATCH are included because PHP 8.4 request_parse_body() parses multipart on them too.
map "$request_method:$content_type" $pp_mp {
    default 0;
    "~*^(POST|PUT|PATCH):\s*multipart/form-data([;,\s]|$)" 1;
}

# Routes that must keep accepting uploads. ADAPT this list to your app, from your logs.
# Matches $request_uri (the original URI, not $uri which becomes /index.php after try_files),
# anchored to a segment boundary so /upload does not also open /uploads-report or /uploader.
map $request_uri $pp_upload_route {
    default 0;
    "~*^/upload(/|\?|$)"                      1;
    "~*^/api/upload(/|\?|$)"                  1;
    "~*^/wp-admin/async-upload\.php(/|\?|$)"  1;
}

# Error-page guard (CRITICAL, do not remove). With `error_page 403 /error/403.html` +
# `recursive_error_pages on` (the ISPConfig default), returning 403 triggers an internal
# redirect to the error page that re-evaluates the server-level `if` with the SAME method and
# Content-Type -> "rewrite or internal redirection cycle" -> HTTP 500 (PHP is still not
# reached, but the response is wrong and the log fills with errors). This matches $uri, which
# DOES change to the error page on the internal redirect (unlike $request_uri), and excludes
# it. `volatile` is mandatory: without it nginx reuses the value computed before the redirect
# and the cycle stays. Verified on nginx 1.24.
map $uri $pp_errpage {
    volatile;
    default                     0;
    "~^/error/[0-9]{3}\.html$"  1;
}

# Final decision: block only when multipart=1, upload-route=0, error-page=0 -> "100".
map "$pp_mp$pp_upload_route$pp_errpage" $pp_block_mp {
    volatile;
    default 0;
    "100"   1;
}
